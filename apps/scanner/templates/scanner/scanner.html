{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>scanner - RWB</title>
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
    <link rel="icon" type="image/png" href="{% static 'img/favicon-96x96.png' %}" sizes="96x96"/>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %} "/>
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/apple-touch-icon.png' %}"/>
    <meta name="apple-mobile-web-app-title" content="scanner - RWB"/>
    <link rel="manifest" href="{% static 'img/site.webmanifest' %}"/>

    <!-- Ativa o modo "app" (sem barra de navegação do Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Cor da barra de status (pode ser default, black, black-translucent) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
          rel="stylesheet"/>

    <style>
        :root {
            --ink: #0B0B0B;
            --muted: #6B6B6B;
            --line: #E7E7E7;
            --paper: #FFFFFF;
            --brand: #FABB00;
            --brand-dark: #E1A800;

            /* Cores de estado (mantidas) */
            --green: #16A34A;
            --red: #DC2626;
            --yellow: #D97706;
            --blue: #2563EB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--ink);
            color: #fff;
            min-height: 100vh;
            /* removido flex/overflow para não forçar altura */
        }

        /* ── APP HEADER ── */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
        }

        .app-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            color: #fff;
        }

        .app-brand span {
            color: var(--brand);
        }

        .app-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-actions button {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            transition: background .2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-actions button:hover {
            background: #2a2a2a;
        }

        .app-actions .user-badge {
            font-size: 12px;
            color: var(--muted);
            background: #2a2a2a;
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* ── CAMERA ── */
        .camera-wrap {
            position: relative;
            width: 100%;
            max-width: 480px;
            margin: 16px auto 0;
            aspect-ratio: 1/1;
            background: #000;
            overflow: hidden;
            border-radius: 16px;
        }

        #camera-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #camera-canvas {
            display: none;
        }

        .viewfinder {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .viewfinder::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 0%, 20% 20%, 20% 80%, 80% 80%, 80% 20%, 20% 20%);
        }

        .corner {
            position: absolute;
            width: 36px;
            height: 36px;
            border-color: var(--brand);
            border-style: solid;
        }

        .corner-tl {
            top: 20%;
            left: 20%;
            border-width: 3px 0 0 3px;
            border-radius: 4px 0 0 0;
        }

        .corner-tr {
            top: 20%;
            right: 20%;
            border-width: 3px 3px 0 0;
            border-radius: 0 4px 0 0;
        }

        .corner-bl {
            bottom: 20%;
            left: 20%;
            border-width: 0 0 3px 3px;
            border-radius: 0 0 0 4px;
        }

        .corner-br {
            bottom: 20%;
            right: 20%;
            border-width: 0 3px 3px 0;
            border-radius: 0 0 4px 0;
        }

        .scan-line {
            position: absolute;
            left: 20%;
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--brand), transparent);
            top: 20%;
            animation: scanMove 2s ease-in-out infinite;
        }

        @keyframes scanMove {
            0%, 54% {
                top: 20%;
            }
            48% {
                top: 78%;
            }
            50%, 52% {
                opacity: 0;
            }
            0%, 54%, 100% {
                opacity: 1;
            }
        }

        .cam-status {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, .5);
        }

        /* ── CONTROLES ── */
        .controls {
            display: flex;
            gap: 10px;
            padding: 12px 20px;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity .15s, transform .1s;
        }

        .btn:active {
            transform: scale(.97);
        }

        .btn-primary {
            background: var(--brand);
            color: var(--ink);
        }

        .btn-primary:hover {
            opacity: .9;
        }

        .btn-secondary {
            background: #2a2a2a;
            color: var(--muted);
            border: 1px solid #3a3a3a;
        }

        .btn-secondary:hover {
            background: #333;
        }

        /* ── MANUAL ── */
        .manual-area {
            padding: 10px 20px;
            background: #1a1a1a;
            display: none;
        }

        .manual-area.open {
            display: block;
        }

        .manual-row {
            display: flex;
            gap: 8px;
        }

        .manual-input {
            flex: 1;
            padding: 10px 14px;
            background: #0b0b0b;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .manual-input:focus {
            border-color: var(--brand);
        }

        .manual-input::placeholder {
            color: #555;
        }

        /* ── TABS ── */
        .tabs {
            display: flex;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
        }

        .tab {
            flex: 1;
            padding: 12px 4px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .tab.active {
            color: var(--brand);
            border-bottom-color: var(--brand);
        }

        /* ── PANELS ── */
        .panel {
            display: none;
            padding: 16px 20px;
            background: var(--ink);
        }

        .panel.active {
            display: block;
        }

        /* ── RESULT IDLE ── */
        .result-idle {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #555;
            text-align: center;
            padding: 40px 0;
        }

        .result-idle p {
            font-size: 14px;
        }

        /* ── RESULT CARD ── */
        .result-card {
            border-radius: 12px;
            overflow: hidden;
            display: none;
            background: #1a1a1a;
            margin-top: 8px;
        }

        .result-card.visible {
            display: block;
        }

        .result-header {
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .result-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .result-title {
            font-size: 17px;
            font-weight: 700;
        }

        .result-sub {
            font-size: 13px;
            opacity: .75;
            margin-top: 2px;
        }

        .state-ok .result-header {
            background: #14532d;
        }

        .state-ok .result-icon {
            background: var(--green);
            color: #fff;
        }

        .state-already .result-header {
            background: #1e3a5f;
        }

        .state-already .result-icon {
            background: var(--blue);
            color: #fff;
        }

        .state-not-paid .result-header {
            background: #451a03;
        }

        .state-not-paid .result-icon {
            background: var(--yellow);
            color: #fff;
        }

        .state-error .result-header {
            background: #450a0a;
        }

        .state-error .result-icon {
            background: var(--red);
            color: #fff;
        }

        .result-body {
            padding: 14px 16px;
            background: #161616;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 8px 0;
            border-bottom: 1px solid #222;
            gap: 8px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--muted);
            flex-shrink: 0;
        }

        .info-value {
            font-size: 14px;
            font-weight: 500;
            text-align: right;
            word-break: break-word;
        }

        /* ── LOG ── */
        .log-panel {
            padding: 0;
        }

        .log-header {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .log-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: #161616;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .log-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .log-dot.ok {
            background: var(--green);
        }

        .log-dot.already_entered {
            background: var(--blue);
        }

        .log-dot.not_paid {
            background: var(--yellow);
        }

        .log-dot.not_found,
        .log-dot.invalid_qr {
            background: var(--red);
        }

        .log-id {
            color: #aaa;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .log-time {
            font-size: 11px;
            color: #555;
            flex-shrink: 0;
        }

        /* ── STATS MODAL ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            z-index: 100;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: #1a1a1a;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 480px;
            padding: 20px 20px 32px;
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin: 0 auto 16px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--brand);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #262626;
            font-size: 14px;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-num {
            font-weight: 700;
            font-size: 18px;
        }

        .stat-num.green {
            color: var(--green);
        }

        .stat-num.yellow {
            color: var(--yellow);
        }

        .event-filter {
            margin-top: 14px;
        }

        .event-filter label {
            font-size: 11px;
            color: var(--muted);
            display: block;
            margin-bottom: 6px;
        }

        .event-select {
            width: 100%;
            padding: 9px 12px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
        }

        /* ── SPINNER ── */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #333;
            border-top-color: var(--brand);
            border-radius: 50%;
            animation: spin .6s linear infinite;
            margin: 16px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── FLASHES ── */
        .flash-ok {
            animation: fok .4s ease-out;
        }

        .flash-error {
            animation: ferr .4s ease-out;
        }

        @keyframes fok {
            50% {
                box-shadow: 0 0 0 8px rgba(22, 163, 74, .4);
            }
        }

        @keyframes ferr {
            50% {
                box-shadow: 0 0 0 8px rgba(220, 38, 38, .4);
            }
        }
    </style>
</head>
<body>

<!-- APP HEADER (sem navbar/footer) -->
<header class="app-header">
    <div class="app-brand">
        <a href="{% url 'core:home' %}" class="flex items-end">
            <img src="{% static 'img/logo.png' %}" alt="Run With Broto Logo" class="h-10 w-auto">
        </a>
    </div>
    <div class="app-actions">
        <span class="user-badge">{{ request.user.username }}</span>
        <button onclick="openStats()" title="Estatísticas">
            <span class="material-symbols-outlined">bar_chart</span>
        </button>
    </div>
</header>

<!-- CÂMERA -->
<div class="camera-wrap" id="cameraWrap">
    <video id="camera-video" autoplay muted playsinline></video>
    <canvas id="camera-canvas"></canvas>
    <div class="viewfinder">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
        <div class="scan-line"></div>
    </div>
    <div class="cam-status" id="camStatus">A inicializar câmera…</div>
</div>

<!-- CONTROLES -->
<div class="controls">
    <button class="btn btn-primary" id="btnCam" onclick="toggleCamera()">
        <span class="material-symbols-outlined" style="font-size:18px">pause</span> Pausar
    </button>
    <button class="btn btn-secondary" onclick="toggleManual()">
        <span class="material-symbols-outlined" style="font-size:18px">edit_note</span> Manual
    </button>
</div>

<!-- MANUAL INPUT -->
<div class="manual-area" id="manualArea">
    <div class="manual-row">
        <input class="manual-input" id="manualInput" type="text"
               placeholder="ID do bilhete (ex: TKT-123) ou QR completo"
               autocomplete="off" autocorrect="off" spellcheck="false"/>
        <button class="btn btn-primary" style="flex:0;padding:10px 16px" onclick="submitManual()">
            <span class="material-symbols-outlined" style="font-size:18px">done</span>
        </button>
    </div>
</div>

<!-- TABS -->
<div class="tabs">
    <div class="tab active" onclick="switchTab('result')">
        <span class="material-symbols-outlined" style="font-size:18px">fact_check</span> Resultado
    </div>
    <div class="tab" onclick="switchTab('log')">
        <span class="material-symbols-outlined" style="font-size:18px">history</span> Histórico
    </div>
</div>

<!-- PANEL: RESULTADO -->
<div class="panel active" id="panel-result">
    <div class="result-idle" id="resultIdle">
        <span class="material-symbols-outlined" style="font-size:64px;color:#444">qr_code_scanner</span>
        <p>Aponte a câmera para o QR do bilhete</p>
    </div>
    <div class="result-card" id="resultCard">
        <div class="result-header" id="resultHeader">
            <div class="result-icon" id="resultIcon"></div>
            <div>
                <div class="result-title" id="resultTitle"></div>
                <div class="result-sub" id="resultSub"></div>
            </div>
        </div>
        <div class="result-body" id="resultBody"></div>
    </div>
</div>

<!-- PANEL: LOG -->
<div class="panel" id="panel-log">
    <div class="log-panel">
        <div class="log-header">Últimas 50 leituras</div>
        <div id="logList">
            <div class="spinner"></div>
        </div>
    </div>
</div>

<!-- MODAL ESTATÍSTICAS -->
<div class="modal-overlay" id="statsModal" onclick="closeStats(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-title">
            <span class="material-symbols-outlined">analytics</span> Estatísticas
        </div>
        <div id="statsContent">
            <div class="spinner"></div>
        </div>
        <div class="event-filter" id="eventFilterWrap" style="display:none">
            <label>Filtrar por evento</label>
            <select class="event-select" id="eventSelect" onchange="loadStats()">
                <option value="">Todos os eventos</option>
            </select>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
    // ── URLs e CSRF ──
    const VALIDATE_URL = "{% url 'scanner:validate' %}";
    const STATS_URL = "{% url 'scanner:stats' %}";
    const LOG_URL = "{% url 'scanner:log' %}";
    const CSRF = "{{ csrf_token }}";

    // ── Câmera ──────────────────────────────────────────────
    const video = document.getElementById("camera-video");
    const canvas = document.getElementById("camera-canvas");
    const ctx = canvas.getContext("2d", {willReadFrequently: true});
    let scanning = true, stream = null, lastQR = "", lastQRTime = 0;
    const COOLDOWN = 3000;

    async function startCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: {facingMode: "environment", width: {ideal: 1280}, height: {ideal: 720}},
                audio: false,
            });
            video.srcObject = stream;
            video.addEventListener("loadedmetadata", () => {
                video.play();
                document.getElementById("camStatus").textContent = "Pronto para escanear";
                requestAnimationFrame(scanFrame);
            });
        } catch {
            document.getElementById("camStatus").textContent = "Câmera indisponível use o modo manual";
        }
    }

    function toggleCamera() {
        const btn = document.getElementById("btnCam");
        scanning = !scanning;
        btn.innerHTML = scanning
            ? '<span class="material-symbols-outlined" style="font-size:18px">pause</span> Pausar'
            : '<span class="material-symbols-outlined" style="font-size:18px">play_arrow</span> Retomar';
        btn.className = scanning ? "btn btn-primary" : "btn btn-secondary";
        if (scanning) requestAnimationFrame(scanFrame);
    }

    function scanFrame() {
        if (!scanning) return;
        if (video.readyState !== video.HAVE_ENOUGH_DATA) {
            requestAnimationFrame(scanFrame);
            return;
        }
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(img.data, img.width, img.height, {inversionAttempts: "dontInvert"});
        if (code?.data) {
            const now = Date.now();
            if (code.data !== lastQR || now - lastQRTime > COOLDOWN) {
                lastQR = code.data;
                lastQRTime = now;
                handleQR(code.data);
            }
        }
        requestAnimationFrame(scanFrame);
    }

    // ── Validação ──────────────────────────────────────────
    function handleQR(raw) {
        const qr = raw.includes("|") ? raw : `RWB|${raw}`;  // QR assinado da API traz "|"; ID solto = formato antigo
        doValidate(qr);
    }

    function toggleManual() {
        document.getElementById("manualArea").classList.toggle("open");
        if (document.getElementById("manualArea").classList.contains("open")) {
            document.getElementById("manualInput").focus();
        }
    }

    function submitManual() {
        const v = document.getElementById("manualInput").value.trim();
        if (v) {
            handleQR(v);
            document.getElementById("manualInput").value = "";
        }
    }

    document.getElementById("manualInput").addEventListener("keydown", e => {
        if (e.key === "Enter") submitManual();
    });

    async function doValidate(qr) {
        switchTab("result");
        showLoading();
        try {
            const r = await fetch(VALIDATE_URL, {
                method: "POST",
                headers: {"Content-Type": "application/json", "X-CSRFToken": CSRF},
                body: JSON.stringify({qr_value: qr}),
            });
            showResult(await r.json());
        } catch {
            showResult({status: "error", message: "Erro de ligação."});
        }
        if (document.getElementById("panel-log").classList.contains("active")) loadLog();
    }

    // ── UI Resultado ──────────────────────────────────────
    const STATE = {
        ok: {icon: "check_circle", title: "ENTRADA AUTORIZADA", cls: "state-ok", flash: "flash-ok"},
        already_entered: {icon: "how_to_reg", title: "JÁ ENTROU", cls: "state-already", flash: "flash-error"},
        not_paid: {icon: "warning", title: "PAGAMENTO PENDENTE", cls: "state-not-paid", flash: "flash-error"},
        not_found: {icon: "cancel", title: "NÃO ENCONTRADO", cls: "state-error", flash: "flash-error"},
        invalid_qr: {icon: "cancel", title: "QR INVÁLIDO", cls: "state-error", flash: "flash-error"},
        error: {icon: "error", title: "ERRO", cls: "state-error", flash: "flash-error"},
    };

    function showLoading() {
        document.getElementById("resultIdle").style.display = "none";
        const card = document.getElementById("resultCard");
        card.className = "result-card visible state-ok";
        document.getElementById("resultIcon").innerHTML = '<span class="material-symbols-outlined" style="font-size:28px">progress_activity</span>';
        document.getElementById("resultTitle").textContent = "A validar…";
        document.getElementById("resultSub").textContent = "";
        document.getElementById("resultBody").innerHTML = '<div class="spinner"></div>';
    }

    function showResult(data) {
        const cfg = STATE[data.status] || STATE.error;
        document.getElementById("resultIdle").style.display = "none";
        const card = document.getElementById("resultCard");
        card.className = `result-card visible ${cfg.cls}`;
        document.getElementById("resultIcon").innerHTML = `<span class="material-symbols-outlined" style="font-size:28px">${cfg.icon}</span>`;
        document.getElementById("resultTitle").textContent = cfg.title;
        document.getElementById("resultSub").textContent = data.message || "";

        const body = document.getElementById("resultBody");
        if (data.ticket) {
            const t = data.ticket;
            body.innerHTML = `
        ${row("Nome", t.buyer_name)}
        ${row("Telefone", t.buyer_phone)}
        ${row("Evento", t.event_name)}
        ${row("Data", t.event_date)}
        ${t.ticket_type ? row("Tipo", `<strong>${esc(t.ticket_type)}</strong>`, true) : ""}
        ${row("Pagamento", badge(t.payment_status), true)}
        ${t.tamanho_camisete && t.tamanho_camisete !== "—" ? row("T-shirt", t.tamanho_camisete) : ""}
        ${row("Ticket ID", `<span style="font-size:12px;color:#888">${esc(t.external_id)}</span>`, true)}
      `;
        } else {
            body.innerHTML = `<p style="font-size:13px;color:#666;padding:12px 0;text-align:center">${esc(data.message)}</p>`;
        }

        const wrap = document.getElementById("cameraWrap");
        wrap.classList.remove("flash-ok", "flash-error");
        void wrap.offsetWidth;
        wrap.classList.add(cfg.flash);
        if (navigator.vibrate) navigator.vibrate(data.status === "ok" ? [100] : [80, 60, 80]);
    }

    function esc(v) {
        return String(v ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
    }

    // `value` é escapado, a não ser que venha marcado como HTML seguro (html=true).
    function row(label, value, html = false) {
        return `<div class="info-row"><span class="info-label">${label}</span><span class="info-value">${html ? value : esc(value) || "—"}</span></div>`;
    }

    function badge(s) {
        const m = {paid: ["var(--green)", "PAGO"], pending: ["var(--yellow)", "PENDENTE"]};
        const [c, l] = m[(s || "").toLowerCase()] || ["var(--muted)", s || "—"];
        return `<span style="color:${c};font-weight:700">${esc(l)}</span>`;
    }

    // ── Tabs ──────────────────────────────────────────────
    function switchTab(name) {
        document.querySelectorAll(".tab").forEach((el, i) => {
            const tabName = ["result", "log"][i];
            el.classList.toggle("active", tabName === name);
            document.getElementById(`panel-${tabName}`).classList.toggle("active", tabName === name);
        });
        if (name === "log") loadLog();
    }

    // ── Log ───────────────────────────────────────────────
    async function loadLog() {
        const sel = document.getElementById("eventSelect");
        const param = sel?.value ? `?event_name=${encodeURIComponent(sel.value)}` : "";
        try {
            const data = await (await fetch(LOG_URL + param)).json();
            const list = document.getElementById("logList");
            if (!data.logs.length) {
                list.innerHTML = '<p style="color:#555;font-size:13px;text-align:center;padding:16px">Sem registos</p>';
                return;
            }
            list.innerHTML = data.logs.map(l => `
        <div class="log-item">
          <div class="log-dot ${esc(l.result)}"></div>
          <span class="log-id">${esc(l.ticket_id) || "—"}</span>
          <span style="font-size:12px;color:#888">${esc(l.result_display)}</span>
          <span class="log-time">${l.scanned_at}</span>
        </div>
      `).join("");
        } catch {
            document.getElementById("logList").innerHTML = '<p style="color:#555;font-size:13px;text-align:center;padding:16px">Erro ao carregar</p>';
        }
    }

    // ── Stats ─────────────────────────────────────────────
    function openStats() {
        document.getElementById("statsModal").classList.add("open");
        loadStats();
    }

    function closeStats(e) {
        if (e.target === document.getElementById("statsModal")) {
            document.getElementById("statsModal").classList.remove("open");
        }
    }

    async function loadStats() {
        const sel = document.getElementById("eventSelect");
        const param = sel?.value ? `?event_name=${encodeURIComponent(sel.value)}` : "";
        document.getElementById("statsContent").innerHTML = '<div class="spinner"></div>';
        try {
            const data = await (await fetch(STATS_URL + param)).json();
            if (data.events?.length > 1) {
                document.getElementById("eventFilterWrap").style.display = "block";
                const cur = sel.value;
                sel.innerHTML = '<option value="">Todos os eventos</option>' +
                    data.events.map(e => `<option value="${esc(e)}" ${e === cur ? "selected" : ""}>${esc(e)}</option>`).join("");
            }
            const pct = data.total_paid > 0 ? Math.round(data.total_entered / data.total_paid * 100) : 0;
            document.getElementById("statsContent").innerHTML = `
        <div class="stat-row"><span>Total com pagamento</span><span class="stat-num">${data.total_paid}</span></div>
        <div class="stat-row"><span>Já entraram</span><span class="stat-num green">${data.total_entered}</span></div>
        <div class="stat-row"><span>Ainda por entrar</span><span class="stat-num yellow">${data.total_pending}</span></div>
        <div class="stat-row"><span>Taxa de presença</span><span class="stat-num">${pct}%</span></div>
      `;
        } catch {
            document.getElementById("statsContent").innerHTML = '<p style="color:#666;font-size:13px;text-align:center">Erro ao carregar</p>';
        }
    }

    // ── Inicialização ─────────────────────────────────────
    startCamera();
</script>
</body>
</html>
